<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #111; }
      main { text-align: center; padding: 2rem; }
      a { color: #0a58ca; }
      .muted { color: #666; font-size: 0.9rem; }
      pre { background: #f6f8fa; padding: .75rem; border-radius: 6px; overflow: auto; }
    </style>
    <script>
      (() => {
        function setAnchor(url) {
          const a = document.getElementById('target');
          if (a) { a.href = url; a.textContent = url; }
        }

        try {
          // Extract URL directly from query string (e.g., ?https://example.com)
          // Remove the leading '?' and decode
          const queryString = location.search;
          if (!queryString || queryString.length < 2) {
            throw new Error('No URL provided. Use format: ?https://example.com');
          }

          const targetUrl = decodeURIComponent(queryString.substring(1));

          // Basic sanity check for URL
          if (!/^https?:\/\//i.test(targetUrl)) {
            throw new Error('Invalid URL (must start with http:// or https://): ' + targetUrl);
          }

          setAnchor(targetUrl);
          location.replace(targetUrl);

        } catch (e) {
          const status = document.getElementById('status');
          const err = document.getElementById('error');
          if (status) status.textContent = 'Could not determine redirect target. ' +
            'Provide a URL in the format: ?https://your-target-url';
          if (err) err.textContent = String(e);
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Redirecting…</h1>
      <p>If you are not redirected automatically, <a id="target" href="#">click here</a>.</p>
      <p id="status" class="muted"></p>
      <pre id="error" class="muted"></pre>
    </main>
  </body>
</html>
